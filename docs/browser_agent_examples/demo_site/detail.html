<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 48px auto; padding: 20px; }
    dt { font-weight: 700; margin-top: 12px; } dd { margin-left: 0; }
  </style>
</head>
<body>
  <a href="/index.html">返回商品目录</a>
  <h1 data-testid="product-name"></h1>
  <!-- 稳定字段标记供 05 提取事实；价格只显示整数，方便结构化输出校验。 -->
  <dl>
    <dt>分类</dt><dd data-testid="product-category"></dd>
    <dt>价格（人民币元）</dt><dd data-testid="product-price"></dd>
    <dt>规格</dt><dd data-testid="product-specs"></dd>
    <dt>使用说明</dt><dd data-testid="product-details"></dd>
  </dl>
  <!-- 与目录共享数据，避免两份硬编码商品信息不一致。 -->
  <script src="/catalog.js"></script>
  <script>
    // 查询字符串只用来查找固定商品，不发出网络请求或执行其中的内容。
    const id = new URLSearchParams(location.search).get('id');
    const product = window.DEMO_PRODUCTS.find(product => product.id === id);
    // 无效或缺失 id 显示明确提示，不退回其他商品以免误导结果验收。
    if (!product) document.querySelector('h1').textContent = '商品不存在';
    else {
      // 字段名与 data-testid 一一对应，用纯文本填充详情，不拼接 HTML。
      for (const key of ['name', 'category', 'price', 'specs', 'details']) {
        document.querySelector(`[data-testid="product-${key}"]`).textContent = product[key];
      }
      document.title = `${product.name} - 商品详情`;
    }
  </script>
</body>
</html>
