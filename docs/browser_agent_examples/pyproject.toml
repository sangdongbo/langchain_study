[project]
# 独立学习项目，不改动仓库其他示例的依赖环境。
name = "browser-agent-examples"
version = "0.1.0"
description = "Progressive Playwright and browser-use examples"
requires-python = ">=3.11,<4"
dependencies = [
    # 固定已验证的版本，避免教学示例被上游 API 变化影响。
    "browser-use==0.13.11",
    "playwright==1.63.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.2",
]

[build-system]
# uv 将共享包安装到本项目环境；无需前端打包或构建命令。
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 共享模块可直接 import；各专题 run.py 仍作为独立脚本执行。
packages = ["browser_examples"]
