<!-- 仅供离线测试拼入 fixture.html；账号、验证码与 token 均为虚构。 -->
<!-- 由 test.py 拼入订单 fixture，#business 是测试包装容器，不是真实站业务选择器。 -->
<section id="login">
  <input placeholder="请输入手机号/邮箱">
  <input placeholder="验证码">
  <button id="send-code">获取验证码</button>
  <button id="submit-login">登录</button>
  <output id="login-error"></output>
</section>
<script>
// 模拟真实站：未登录展示认证表单，成功后先进入工作台而不是订单页。
const business = document.querySelector('#business');
const login = document.querySelector('#login');
// fixture-live 表示虚构会话有效；其他值（包括 fixture-expired）都要求人工登录。
// 生产代码不会读取这个键，它只通过页面是否可访问来判断认证状态。
function hasFixtureSession() {
  return localStorage.getItem('fixture-token') === 'fixture-live';
}
// 在同一标签页响应路由：订单页卸载认证表单，工作台隐藏业务区，详情仍属于业务区。
function showFixtureRoute() {
  const authenticated = hasFixtureSession();
  const isOrder = location.hash === '#/order';
  const isBusinessRoute = isOrder || location.hash.startsWith('#/order_detail?');
  business.hidden = !authenticated || !isBusinessRoute;
  if (authenticated && isOrder) login.remove();
  else login.hidden = authenticated;
}
showFixtureRoute();
window.addEventListener('hashchange', showFixtureRoute);
document.querySelector('#send-code')?.addEventListener('click', () => {
  // 只计数，不请求短信平台；测试区分程序等待与模拟用户主动点击。
  localStorage.setItem('fixture-sms-count', String(Number(localStorage.getItem('fixture-sms-count') || 0) + 1));
});
document.querySelector('#submit-login')?.addEventListener('click', () => {
  // 这里读取验证码只是虚构站点验证器；生产 auth.py 不读取验证码输入值。
  // 固定数字仅为离线测试数据，不能用于真实站登录，也不是历史对话提供的验证码。
  if (document.querySelector('input[placeholder="验证码"]').value !== '246810') {
    document.querySelector('#login-error').textContent = '虚构验证码错误';
    return;
  }
  // 先隐藏表单，再延迟完成认证/跳转，复现“表单隐藏不等于登录已完成”的竞态。
  login.hidden = true;
  setTimeout(() => {
    localStorage.setItem('fixture-token', 'fixture-live');
    location.hash = '/workBench';
  }, 150);
});
</script>
