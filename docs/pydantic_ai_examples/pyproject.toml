[project]
name = "pydantic-ai-examples"
version = "0.1.0"
description = "Progressive runnable PydanticAI tutorials with offline checks"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]==2.55.0",
    "python-dotenv>=1.2.2,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_examples"]
